name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-and-sqlfluff:
    name: dbt build + SQLFluff
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-duckdb>=1.8.0" "duckdb>=1.1.0" "sqlfluff>=3.0.0,<4"

      - name: Seed DuckDB from mysql/seed.sql (no MySQL / DLT)
        run: python scripts/ci_seed_duckdb.py

      - name: dbt parse
        working-directory: dbt_model
        run: dbt parse --profiles-dir .

      - name: dbt source freshness
        working-directory: dbt_model
        run: dbt source freshness --profiles-dir .

      - name: dbt run (bronze/silver + non-customer gold)
        working-directory: dbt_model
        run: dbt run --exclude dim_customer fact_sales --profiles-dir .

      - name: dbt snapshot (customer SCD2 history)
        working-directory: dbt_model
        run: dbt snapshot --select snapshot_customer --profiles-dir .

      - name: dbt build (gold models + gold/SCD/business tests)
        working-directory: dbt_model
        run: >
          dbt build
          --select path:models/gold path:tests
          --profiles-dir .

      - name: SQLFluff (permissive — models only)
        run: |
          sqlfluff lint dbt_model/models \
            --config .sqlfluff \
            --disable-progress-bar
