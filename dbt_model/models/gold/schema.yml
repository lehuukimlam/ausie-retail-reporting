version: 2

models:
  - name: dim_date
    description: Date dimension (calendar + AU FY). PK date_key.
    columns:
      - name: date_key
        description: Surrogate PK as YYYYMMDD
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null

  - name: dim_location
    description: Store / channel dimension. PK location_key.
    columns:
      - name: location_key
        tests:
          - unique
          - not_null
      - name: store_code
        tests:
          - unique
          - not_null
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ["offline", "online"]

  - name: dim_product
    description: Product VERSION dimension (SCD2). PK product_key.
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: sku
        tests:
          - not_null

  - name: dim_staff
    description: Staff VERSION dimension (SCD2). PK staff_key.
    columns:
      - name: staff_key
        tests:
          - unique
          - not_null
      - name: staff_id
        tests:
          - not_null

  - name: dim_customer
    description: Customer dimension. PK customer_key. Guests are NULL on fact.
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null

  - name: fact_sales
    description: >
      Line-grain sales fact (POS + online). Linking table of the star —
      FKs point at dim PKs (M:1 from fact to each dim).
    columns:
      - name: fact_sales_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: location_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: staff_key
        description: NULL for online channel
        tests:
          - relationships:
              to: ref('dim_staff')
              field: staff_key
      - name: customer_key
        description: NULL for guest checkout
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ["offline", "online"]
      - name: qty
        tests:
          - not_null
      - name: revenue_inc_gst
        tests:
          - not_null
