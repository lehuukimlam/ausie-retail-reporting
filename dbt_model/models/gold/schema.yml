version: 2

models:
  - name: dim_date
    description: >
      Date dimension for reporting. One row = one calendar day.
      Use for trading-date filters and trends. PK date_key (YYYYMMDD).
    config:
      contract:
        enforced: true
    meta:
      owner: analyst
      layer: gold
    columns:
      - name: date_key
        description: Trading date key (YYYYMMDD). Joins to fact_sales.date_key.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: full_date
        description: Calendar date (business label - Trading date).
        data_type: date
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: calendar_year
        data_type: bigint
      - name: calendar_month
        data_type: bigint
      - name: month_name
        data_type: varchar
      - name: calendar_day
        data_type: bigint
      - name: day_name
        data_type: varchar
      - name: iso_week
        data_type: bigint
      - name: fiscal_year_au
        data_type: bigint
      - name: season_au
        data_type: varchar
      - name: is_boxing_day
        data_type: boolean
      - name: is_eofy
        data_type: boolean
      - name: is_click_frenzy
        data_type: boolean

  - name: dim_location
    description: >
      Store or online location. One row = one location.
      Business labels - Store, Store code, State, Channel.
    config:
      contract:
        enforced: true
    meta:
      owner: analyst
      layer: gold
    columns:
      - name: location_key
        description: Location key. Joins to fact_sales.location_key.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: store_code
        description: Short store code (e.g. MEL01).
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: store_name
        description: Store or channel display name.
        data_type: varchar
      - name: channel
        description: Location channel attribute (offline or online).
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              values: ["offline", "online"]
      - name: state_code
        description: Standard Australian state code (e.g. NSW, VIC).
        data_type: varchar
      - name: postcode
        data_type: varchar
      - name: suburb
        data_type: varchar
      - name: timezone_name
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: is_active
        data_type: boolean

  - name: dim_product
    description: >
      Product VERSION dimension (SCD2). One row = one product version,
      not one forever SKU. Category on a sale is the category on this version
      (historical at time of sale). PK product_key.
    config:
      contract:
        enforced: true
    meta:
      owner: analyst
      layer: gold
    columns:
      - name: product_key
        description: Product version key. Joins to fact_sales.product_key.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: product_id
        description: Durable product id across versions.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: sku
        description: SKU code.
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: product_name
        description: Product name for this version.
        data_type: varchar
      - name: category_name
        description: >
          Category (business label). Category recorded on this product version —
          use for historical sales by category, not necessarily today's category.
        data_type: varchar
      - name: brand_name
        description: Brand for this version.
        data_type: varchar
      - name: unit_of_measure
        data_type: varchar
      - name: unit_cost_ex_gst
        description: Unit cost excluding GST (ERP basis) for this version.
        data_type: decimal(13,4)
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: unit_price_ex_gst
        data_type: decimal(13,4)
      - name: unit_price_inc_gst
        data_type: decimal(18,4)
      - name: unit_cost_inc_gst
        data_type: decimal(18,4)
      - name: gst_rate
        data_type: decimal(7,6)
      - name: is_active
        data_type: boolean
      - name: valid_from
        data_type: date
      - name: valid_to
        data_type: date
      - name: is_current
        data_type: boolean

  - name: dim_staff
    description: >
      Staff VERSION dimension (SCD2). One row = one staff role/location version.
      Online sales often have no staff on the fact.
    config:
      contract:
        enforced: true
    meta:
      owner: analyst
      layer: gold
      contains_pii: true
    columns:
      - name: staff_key
        description: Staff version key. Joins to fact_sales.staff_key when present.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: staff_id
        description: Durable staff id across versions.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: staff_number
        data_type: varchar
      - name: home_store_id
        data_type: bigint
      - name: first_name
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: last_name
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: staff_name
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: email
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: role_name
        data_type: varchar
      - name: state_code
        data_type: varchar
      - name: valid_from
        data_type: date
      - name: valid_to
        data_type: date
      - name: is_current
        data_type: boolean

  - name: dim_customer
    description: >
      Customer VERSION dimension (warehouse SCD2 from snapshot_customer).
      One row = one customer attribute version (e.g. state/address as-at that
      period), not one forever person. Guests have no customer_key on fact_sales
      (blank is allowed — not a fake Guest row).
      Singular tests: assert_dim_customer_no_overlap, assert_dim_customer_one_current.
    config:
      contract:
        enforced: true
    meta:
      owner: analyst
      layer: gold
      contains_pii: true
    columns:
      - name: customer_key
        description: >
          Customer version key (snapshot dbt_scd_id). Joins to
          fact_sales.customer_key when present.
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Durable CRM customer id across versions.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: customer_number
        data_type: varchar
      - name: first_name
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: last_name
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: customer_name
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: email
        description: Customer email as stored for this version.
        data_type: varchar
        constraints:
          - type: not_null
        meta:
          contains_pii: true
        tags: [pii]
        tests:
          - not_null
      - name: phone
        data_type: varchar
        meta:
          contains_pii: true
        tags: [pii]
      - name: suburb
        data_type: varchar
      - name: state_code
        data_type: varchar
      - name: postcode
        data_type: varchar
      - name: country_code
        data_type: varchar
      - name: valid_from
        description: >
          Inclusive start of this version (date). Earliest version is fixed to
          1900-01-01 so historical sales still resolve (created_at is unreliable
          when seed/CI stamp "today").
        data_type: date
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: valid_to
        description: Exclusive end of this version (date); null if current.
        data_type: date
      - name: is_current
        description: True when valid_to is null (latest open version).
        data_type: boolean
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: fact_sales
    description: >
      Sales fact at LINE grain (POS + online). One row = one sale or return line,
      not one whole receipt. Linking table of the star. Money fields are signed
      so returns reduce revenue when summed. See project glossary for Revenue,
      Returns, Channel, Category, Trading date.
      Business-rule singular tests: GST identity, returns negative qty,
      product unit cost not null.
    config:
      contract:
        enforced: true
    meta:
      owner: analyst
      layer: gold
    columns:
      - name: fact_sales_key
        description: Unique sales line id for reporting.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - unique
          - not_null
      - name: date_key
        description: Trading date key (local business day).
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: location_key
        description: Store / fulfilment location key.
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: staff_key
        description: Staff version key. NULL for online channel.
        data_type: bigint
        tests:
          - relationships:
              to: ref('dim_staff')
              field: staff_key
      - name: product_key
        description: Product version key (point-in-time category and cost).
        data_type: bigint
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: customer_id
        description: >
          Durable CRM customer id from the sale (null for guest). Used with
          trading date to resolve customer_key; kept for integrity tests.
        data_type: bigint
      - name: customer_key
        description: >
          Customer version key valid on the sale trading date. NULL for guest
          checkout. Singular test assert_fact_sales_customer_key_when_customer_id
          fails when customer_id is set but this key is null.
        data_type: varchar
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: channel
        description: >
          Channel (business label). Stored values offline (in-store) or online.
          Prefer this field for channel reporting on the fact.
        data_type: varchar
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              values: ["offline", "online"]
      - name: source_system
        description: Source system label on the line (e.g. POS vs e-commerce).
        data_type: varchar
      - name: transaction_id
        description: Transaction or order number.
        data_type: varchar
      - name: line_id
        description: Line number within the transaction.
        data_type: varchar
      - name: original_transaction_id
        description: Original transaction reference for returns when present.
        data_type: varchar
      - name: is_return
        description: Return flag (business label - Return?). True for return lines.
        data_type: boolean
      - name: qty
        description: Quantity. Often negative on returns.
        data_type: decimal(12,3)
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: revenue_inc_gst
        description: >
          Revenue including GST (AUD). Sum for totals; returns are signed negative.
          Do not subtract returns again.
        data_type: decimal(14,2)
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: revenue_ex_gst
        description: >
          Revenue excluding GST (AUD). Prefer when comparing to product cost.
        data_type: decimal(15,2)
      - name: discount_inc_gst
        description: Discount including GST. Line revenue already reflects discount.
        data_type: decimal(14,2)
      - name: gst_amount
        description: GST amount on the line (signed with returns).
        data_type: decimal(14,2)
      - name: unit_price_inc_gst
        description: Unit price including GST.
        data_type: decimal(13,4)
      - name: product_cost_ex_gst
        description: >
          Product cost excluding GST for the line (version unit cost x qty).
          Null cost on the product version fails dim tests (no silent 0 cost).
        data_type: decimal(18,4)
        constraints:
          - type: not_null
        tests:
          - not_null
